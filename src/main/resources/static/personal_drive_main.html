<!DOCTYPE html>
<html lang="en">
    <head>
        <title>personal drive</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="/js/main.js" defer></script>
        <link rel="stylesheet" href="/css/main.css">
        <style type="text/tailwindcss">
            @layer components {
                .buttonStyle {
                    @apply border px-4 py-3 rounded-xl cursor-pointer;
                }
                .tableHeading {
                    @apply p-3 text-left font-normal border-b;
                }
            }
        </style>
        <meta charset="UTF-8">
    </head>
    <body class="min-h-screen p-4">
        <!-- this is to change viewing on different screen sizes -->
        <div class="flex min-h-screen w-full flex-col rounded-xl border-2 md:flex-row">

            <!-- left sidebar -->
            <aside class="flex w-full flex-col gap-6 border-b p-6 md:w-64 md:shrink-0 md:border-r md:border-b-0">
                <header class="text-center text-xl">Personal Drive</header>

                <details class="button-style cursor-pointer">
                    <!-- main thing user sees first and clicks to add new files -->
                    <summary class="buttonStyle cursor-pointer">
                    + New
                    </summary>

                    <!-- hidden section that shows other option when the main thing is clicked -->
                    <div class="flex flex-col gap-2 mt-3">
                        <button id="uploadButton" type="button" class="buttonStyle">+ Upload Files</button>
                        <input id="fileInput" type="file" multiple hidden>
                        <button id="newFolderButton" type="button" class="buttonStyle">+ New Folder</button>
                    </div>
                </details>

                <!-- displays folders created -->
                <nav class="flex flex-col gap-2 mt-3">
                    <h1 class="mb-3">Folders</h1>
                    <ul id="folderDirectory" class="flex flex-col gap-2"></ul>
                </nav>
                
                <!-- helps push this section to the bottom of the page -->
                <div class="mt-auto flex flex-col gap-6">
                    <!-- function buttons -->
                    <button id="favouriteButton" type="button" class="buttonStyle">Favourited</button>
                    <button id="trashButton" type="button" class="buttonStyle">Trash</button>

                    <!-- displays the amount of storage available and used -->
                    <div class="">
                        <h1 id="storageHeading" class="mb-2">Storage Used</h1>
                        <p id="storageUsed" class="text-sm">x GB of x Gb</p>
                    </div>
                </div>
            </aside>

            <!-- right sidebar -->
            <div class="flex-1 min-w-0">
                <!-- for the search bar and the account button -->
                <header id="" class="flex items-center gap-4 p-6 border-b">
                    <input id="searchBar" type="search" placeholder="search" class="border px-3 h-12 w-full rounded-2xl"></input>
                    <button id="accButton" type="button" class="border rounded-full w-12 h-12 shrink-0">Acc</button>
                </header>

                <!-- section for the folder icons -->
                <div class="min-h-64 p-6">
                    <h2 id="filesH2">Folders and Files</h2>
                    <div id="fileGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    
                    </div>
                </div>

                <!-- section for recently added or viewed files -->
                <div class="mt-8 p-6">
                    <h2 id="recentH2" class="mb-4">Recent Files</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full border-2 whitespace-nowrap">
                            <thead>
                                <tr>
                                    <th scope="col" class="tableHeading">Name</th>
                                    <th scope="col" class="tableHeading">Date Created</th>
                                    <th scope="col" class="tableHeading">Location</th>
                                    <th scope="col" class="tableHeading">File Size</th>
                                </tr>
                            </thead>
                            <tbody id="recentFilesBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
